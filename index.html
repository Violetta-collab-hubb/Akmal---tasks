<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Прогноз погоды</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        #weatherData {
            display: none;
            padding: 20px;
            background-color: lightblue;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <h1>Узнать погоду</h1>
    <input type="text" id="cityInput" placeholder="Введите название города"/>
    <button onclick="fetchWeather()">Получить прогноз</button>
    <div id="weatherData"></div>
    <script src="script.js"></script>
</body>
</html>
